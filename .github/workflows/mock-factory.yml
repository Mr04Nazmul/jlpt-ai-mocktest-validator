name: Original JLPT Mock Factory
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'production/**'
      - '.github/workflows/mock-factory.yml'
permissions:
  contents: write
concurrency:
  group: jlpt-original-factory
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - run: python -m pip install -r production/requirements.txt
      - name: Verify software
        run: python -m unittest discover -s production/tests -v
      - name: Install local CPU inference
        run: |
          curl --fail --show-error --location --retry 3 https://ollama.com/install.sh -o /tmp/install-ollama.sh
          sudo OLLAMA_NO_START=1 sh /tmp/install-ollama.sh
          ollama serve > /tmp/jlpt-ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/version; then break; fi
            sleep 2
          done
          ollama pull qwen3:4b
          ollama pull gemma3:4b
      - name: Resume bounded original-exam batch
        run: python production/engine.py run
      - name: Persist checkpoints even after interruption
        if: always()
        run: |
          git config user.name 'JLPT Factory'
          git config user.email 'jlpt-factory@users.noreply.github.com'
          git add production/state production/output
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint original JLPT factory progress [skip ci]'
            git push
          fi
      - name: Show progress and blockers
        if: always()
        run: python production/engine.py status >> "$GITHUB_STEP_SUMMARY"
