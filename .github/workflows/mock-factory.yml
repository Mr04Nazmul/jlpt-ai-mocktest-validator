name: Original JLPT Mock Factory
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'production/**'
      - '.github/workflows/mock-factory.yml'
permissions:
  contents: write
concurrency:
  group: jlpt-original-factory
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - run: python -m pip install -r production/requirements.txt
      - name: Verify software
        run: python -m unittest discover -s production/tests -v
      - name: Resume one examination
        env:
          GENERATOR_API_KEY: ${{ secrets.JLPT_GENERATOR_API_KEY }}
          REVIEWER_API_KEY: ${{ secrets.JLPT_REVIEWER_API_KEY }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.JLPT_DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_JSON: ${{ secrets.JLPT_DRIVE_OAUTH_JSON }}
        run: python production/engine.py run
      - name: Persist checkpoints even when generation is blocked
        if: always()
        run: |
          git config user.name 'JLPT Factory'
          git config user.email 'jlpt-factory@users.noreply.github.com'
          git add production/state production/output
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint original JLPT factory progress [skip ci]'
            git push
          fi
      - name: Show truthful progress
        if: always()
        run: |
          python production/engine.py status >> "$GITHUB_STEP_SUMMARY"
